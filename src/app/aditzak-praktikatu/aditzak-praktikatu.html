<div class="d-flex justify-content-center mx-3">
    <div class="container w-80 text-center">
        @switch (pantalla()) {
            @case ('cargando') {
                <p>Cargando Aditzak...</p>
            }
            @case ('filtros') {
                <app-aditzak-praktikatu-filtros
                    (empezar)="empezar({ aditzak: $event.aditzak, usarGauzak: $event.usarGauzak, practicarDeclinacion: $event.practicarDeclinacion })" />
            }
            @case ('practicando') {
                <app-aditzak-praktikatu-practica
                    [aditzak]="aditzakAEstudiar" [usarGauzak]="usarGauzak" [practicarDeclinacion]="practicarDeclinacion"
                    (reset)="reset()" />
            }
        }
    </div>
</div>
